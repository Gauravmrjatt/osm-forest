# ============================================================================
# OSM ARMY FORTRESS - Docker Compose (Production Hardened)
# ============================================================================
# Start:
#   docker compose up -d --build
#
# Stop:
#   docker compose down
#
# Logs:
#   docker compose logs -f fortress
#
# Update:
#   docker compose pull
#   docker compose up -d
# ============================================================================

services:
  # ==========================================================================
  # FORTRESS APPLICATION
  # ==========================================================================
  fortress:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime

    image: osm-fortress:latest
    container_name: osm-fortress
    hostname: fortress

    restart: unless-stopped

    ports:
      - "3000:3000"

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: 3000

      # MongoDB
      MONGODB_URI: mongodb://${MONGODB_ADMIN_USER:-admin}:${MONGODB_ADMIN_PASS:-change-this-password}@mongodb:27017/osm_fortress?authSource=admin&retryWrites=true&w=majority

      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-change-redis-password}@redis:6379/0

      TZ: UTC

    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - fortress_logs:/app/logs
      - ./data:/app/data

    networks:
      - fortress-net

    # Security
    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    cap_add:
      - NET_BIND_SERVICE

    read_only: false

    tmpfs:
      - /tmp:noexec,nosuid,size=100m

    # Healthcheck
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    # Limits
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M

    stop_grace_period: 35s
    stop_signal: SIGTERM

    labels:
      - com.centurylinklabs.watchtower.enable=true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ==========================================================================
  # MONGODB
  # ==========================================================================
  mongodb:
    image: mongo:7
    container_name: osm-mongodb
    hostname: mongodb

    restart: unless-stopped

    ports:
      - "127.0.0.1:27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ADMIN_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ADMIN_PASS:-change-this-password}
      MONGO_INITDB_DATABASE: osm_fortress
      TZ: UTC

    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb

    networks:
      - fortress-net

    command:
      - mongod
      - --auth
      - --bind_ip_all
      - --wiredTigerCacheSizeGB=0.25
      - --quiet

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    cap_add:
      - CHOWN
      - SETUID
      - SETGID

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh -u \"$MONGO_INITDB_ROOT_USERNAME\" -p \"$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'quit(db.adminCommand(\"ping\").ok ? 0 : 1)' --quiet"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

    labels:
      - com.centurylinklabs.watchtower.enable=false

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ==========================================================================
  # REDIS
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: osm-redis
    hostname: redis

    restart: unless-stopped

    ports:
      - "127.0.0.1:6379:6379"

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-redis-password}
      TZ: UTC

    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-change-redis-password}
      - --appendonly
      - "yes"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
      - --loglevel
      - warning

    volumes:
      - redis_data:/data

    networks:
      - fortress-net

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    cap_add:
      - SETUID
      - SETGID

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

    labels:
      - com.centurylinklabs.watchtower.enable=false

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================================
  # WATCHTOWER
  # ==========================================================================
  watchtower:
    image: containrrr/watchtower:latest
    container_name: osm-watchtower

    restart: unless-stopped

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: 3600
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      WATCHTOWER_LABEL_ENABLE: "true"
      TZ: UTC

    command:
      - --label-enable
      - --cleanup
      - --rolling-restart

    security_opt:
      - no-new-privileges:true

    networks:
      - fortress-net

    labels:
      - com.centurylinklabs.watchtower.enable=false

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ==========================================================================
  # NGINX REVERSE PROXY
  # ==========================================================================
  nginx:
    image: nginx:alpine
    container_name: osm-nginx

    restart: unless-stopped

    depends_on:
      fortress:
        condition: service_healthy

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro

    networks:
      - fortress-net

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    cap_add:
      - NET_BIND_SERVICE

    labels:
      - com.centurylinklabs.watchtower.enable=true

    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================================
  # LOG ROTATION
  # ==========================================================================
  logrotate:
    image: alpine:latest
    container_name: osm-logrotate

    restart: unless-stopped

    volumes:
      - fortress_logs:/logs

    command: >
      sh -c "
      apk add --no-cache logrotate busybox-suid &&
      mkdir -p /etc/logrotate.d &&
      echo '/logs/*.log {
        rotate 7
        daily
        compress
        missingok
        notifempty
        copytruncate
      }' > /etc/logrotate.d/fortress &&
      echo '0 0 * * * /usr/sbin/logrotate /etc/logrotate.conf' | crontab - &&
      crond -f
      "

    networks:
      - fortress-net

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 32M

    labels:
      - com.centurylinklabs.watchtower.enable=false

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  mongodb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/mongodb

  mongodb_config:
    driver: local

  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/redis

  fortress_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./logs

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  fortress-net:
    driver: bridge

    driver_opts:
      com.docker.network.bridge.name: osm-fortress0

    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1